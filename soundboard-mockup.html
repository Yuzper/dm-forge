<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Soundboard Mockup</title>
<style>
  body { margin: 0; background: #0f1117; font-family: 'Segoe UI', sans-serif; color: #e2e8f0; padding: 40px; display: flex; flex-direction: column; gap: 60px; align-items: flex-start; }
  h2 { color: #94a3b8; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 12px 0; }
</style>
</head>
<body>

<div>
  <h2>Floating Widget</h2>
  <svg width="300" height="420" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">

      <filter id="shadow">
        <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>

      <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e2433"/>
        <stop offset="100%" stop-color="#181d2a"/>
      </linearGradient>
      <radialGradient id="playGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>

    <rect x="0" y="28" width="300" height="12" fill="url(#headerGrad)"/>

    <circle cx="140" cy="20" r="2" fill="#4a5568"/>
    <circle cx="150" cy="20" r="2" fill="#4a5568"/>
    <circle cx="160" cy="20" r="2" fill="#4a5568"/>
    <circle cx="170" cy="20" r="2" fill="#4a5568"/>

    <text x="22" y="72" font-size="13" fill="#e2e8f0" font-family="Segoe UI">Dungeon of the Frost Witch</text>
    <text x="266" y="72" font-size="14" fill="#64748b" font-family="Segoe UI">▾</text>

    <!-- Section label: AMBIENCE -->

    <line x1="90" y1="99" x2="288" y2="99" stroke="#1e2d3d" stroke-width="1"/>

    <!-- Ambience buttons -->
    <!-- Playing: Dungeon Drip -->
    <rect x="12" y="110" width="130" height="48" rx="8" fill="#0f2d4a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="125" r="6" fill="#3b82f6"/>
    <rect cx="28" cy="125" x="24" y="122" width="3" height="6" rx="1" fill="#fff"/>

    <text x="40" y="141" font-size="10" fill="#3b82f6" font-family="Segoe UI">● looping</text>
    <!-- Waveform bars -->
    <g transform="translate(12,150)">
      <rect x="90" y="-6" width="3" height="6" rx="1" fill="#3b82f6" opacity="0.8"/>
      <rect x="95" y="-10" width="3" height="10" rx="1" fill="#3b82f6" opacity="0.8"/>
      <rect x="100" y="-4" width="3" height="4" rx="1" fill="#3b82f6" opacity="0.8"/>
      <rect x="105" y="-8" width="3" height="8" rx="1" fill="#3b82f6" opacity="0.8"/>
      <rect x="110" y="-5" width="3" height="5" rx="1" fill="#3b82f6" opacity="0.8"/>
      <rect x="115" y="-9" width="3" height="9" rx="1" fill="#3b82f6" opacity="0.8"/>

    <circle cx="170" cy="125" r="6" fill="#2d3748"/>
    <polygon points="167,122 167,128 173,125" fill="#64748b"/>
    <text x="182" y="127" font-size="12" fill="#94a3b8" font-family="Segoe UI">Forest Wind</text>
    <text x="182" y="141" font-size="10" fill="#4a5568" font-family="Segoe UI">○ stopped</text>

    <!-- Section label: MUSIC -->

    <line x1="55" y1="175" x2="288" y2="175" stroke="#1e2d3d" stroke-width="1"/>

    <!-- Music buttons -->
    <rect x="12" y="186" width="130" height="48" rx="8" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <circle cx="28" cy="201" r="6" fill="#2d3748"/>
    <polygon points="25,198 25,204 31,201" fill="#64748b"/>
    <text x="40" y="203" font-size="12" fill="#94a3b8" font-family="Segoe UI">Combat</text>
    <text x="40" y="217" font-size="10" fill="#4a5568" font-family="Segoe UI">○ stopped</text>

    <rect x="154" y="186" width="134" height="48" rx="8" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <circle cx="170" cy="201" r="6" fill="#2d3748"/>
    <polygon points="167,198 167,204 173,201" fill="#64748b"/>
    <text x="182" y="203" font-size="12" fill="#94a3b8" font-family="Segoe UI">Exploration</text>
    <text x="182" y="217" font-size="10" fill="#4a5568" font-family="Segoe UI">○ stopped</text>

    <text x="14" y="256" font-size="10" fill="#64748b" letter-spacing="1.5" font-family="Segoe UI">EFFECTS</text>
    <line x1="65" y1="251" x2="288" y2="251" stroke="#1e2d3d" stroke-width="1"/>

    <!-- Effect buttons (one-shot, smaller) -->
    <rect x="12" y="262" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="22,277 22,283 28,280" fill="#f59e0b"/>
    <text x="33" y="282" font-size="11" fill="#94a3b8" font-family="Segoe UI">Thunder</text>
    <text x="66" y="272" font-size="9" fill="#4a5568" font-family="Segoe UI">T</text>

    <rect x="108" y="262" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="118,277 118,283 124,280" fill="#f59e0b"/>
    <text x="129" y="282" font-size="11" fill="#94a3b8" font-family="Segoe UI">Door Creak</text>

    <rect x="204" y="262" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="214,277 214,283 220,280" fill="#f59e0b"/>
    <text x="225" y="282" font-size="11" fill="#94a3b8" font-family="Segoe UI">Sword Hit</text>
    <text x="262" y="272" font-size="9" fill="#4a5568" font-family="Segoe UI">S</text>

    <rect x="12" y="306" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="22,321 22,327 28,324" fill="#f59e0b"/>
    <text x="33" y="326" font-size="11" fill="#94a3b8" font-family="Segoe UI">Crowd</text>

    <rect x="108" y="306" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="118,321 118,327 124,324" fill="#f59e0b"/>
    <text x="129" y="326" font-size="11" fill="#94a3b8" font-family="Segoe UI">Wolf Howl</text>

    <rect x="204" y="306" width="84" height="36" rx="6" fill="#1a1f2e" stroke="#2d3748" stroke-width="1"/>
    <polygon points="214,321 214,327 220,324" fill="#f59e0b"/>
    <text x="225" y="326" font-size="11" fill="#94a3b8" font-family="Segoe UI">Fire Crackle</text>

    <!-- Volume row -->
    <rect x="12" y="358" width="276" height="50" rx="8" fill="#0d1117" stroke="#1e2433" stroke-width="1"/>
    <text x="22" y="377" font-size="10" fill="#64748b" font-family="Segoe UI">MASTER VOL</text>
    <rect x="22" y="385" width="200" height="4" rx="2" fill="#1e2433"/>
    <rect x="22" y="385" width="140" height="4" rx="2" fill="#3b82f6"/>
    <circle cx="162" cy="387" r="7" fill="#3b82f6" stroke="#0f1117" stroke-width="2"/>
    <text x="232" y="390" font-size="12" fill="#94a3b8" font-family="Segoe UI">70%</text>
  </svg>
</div>

    <defs>

        <stop offset="0%" stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#111520"/>
      </linearGradient>
    </defs>

    <!-- App background -->
    <rect width="860" height="560" rx="12" fill="#0f1117" stroke="#1e2433" stroke-width="1"/>

    <!-- Sidebar -->
    <rect x="0" y="0" width="200" height="560" rx="12" fill="url(#sidebarGrad)" stroke="#1e2433" stroke-width="0"/>
    <rect x="199" y="0" width="1" height="560" fill="#1e2433"/>

    <text x="20" y="267" font-size="13" fill="#64748b" font-family="Segoe UI">⚔  Stat Blocks</text>

    <text x="20" y="295" font-size="13" fill="#e2e8f0" font-family="Segoe UI" font-weight="600">🔊  Soundboard</text>

    <!-- Header -->
    <rect x="200" y="0" width="660" height="56" fill="#0d1117" stroke="#1e2433" stroke-width="0"/>
    <rect x="200" y="55" width="660" height="1" fill="#1e2433"/>

    <!-- Add board button -->
    <rect x="710" y="14" width="130" height="30" rx="6" fill="#1d4ed8" stroke="#2563eb" stroke-width="1"/>

    <!-- Board 1: Dungeon of the Frost Witch -->
    <rect x="216" y="72" width="628" height="200" rx="10" fill="#12161f" stroke="#1e2433" stroke-width="1"/>

    <rect x="420" y="83" width="100" height="20" rx="10" fill="#1e3a5f" stroke="#2563eb" stroke-width="1"/>

    <text x="762" y="99" font-size="14" fill="#64748b" font-family="Segoe UI">▾</text>

    <rect x="824" y="82" width="22" height="22" rx="4" fill="#1e2433"/>
    <text x="829" y="98" font-size="11" fill="#64748b" font-family="Segoe UI">🗑</text>

    <!-- Column headers -->

    <text x="236" y="354" font-size="12" fill="#4a5568" font-family="Segoe UI">4 sounds — Tavern Crowd, Lute Music, Fire Crackle, Rain on Roof</text>
